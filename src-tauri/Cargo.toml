[package]
name = "agentwatch"
version = "0.1.0"
description = "Floating widget showing the live state of Claude Code sessions"
edition = "2021"
rust-version = "1.85"

[lib]
name = "agentwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.9"
dirs = "7.0.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.11.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
