[package]
name = "agentwatch"
version = "0.1.0"
description = "Floating widget showing the live state of Claude Code sessions"
edition = "2021"
rust-version = "1.85"

[lib]
name = "agentwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.9"
dirs = "7.0.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "process"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
